name: Fusion Git Desk macOS Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    paths:
      - "**"
      - ".github/workflows/fusion-git-desk-macos.yml"

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Run tests
        run: go test ./...

      - name: Build macOS package
        run: bash ./scripts/build-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FusionGitDesk-macos-universal
          path: |
            build/dist/*.zip
            build/dist/*.dmg
