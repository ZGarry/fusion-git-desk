name: Fusion Git Desk Desktop Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "**"
      - ".github/workflows/fusion-git-desk-macos.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install Wails
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
          "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build, test and package Windows app
        shell: pwsh
        run: |
          Push-Location frontend
          pnpm build
          Pop-Location
          go test ./...
          wails build -skipbindings
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null
          Copy-Item build/bin/FusionGitDesk.exe build/dist/FusionGitDesk-windows-x64.exe
          Compress-Archive -Path build/dist/FusionGitDesk-windows-x64.exe -DestinationPath build/dist/FusionGitDesk-windows-x64.zip -Force
          $files = @('FusionGitDesk-windows-x64.exe', 'FusionGitDesk-windows-x64.zip')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "build/dist/$file").Hash.ToLowerInvariant()
            "$hash  $file"
          }
          Set-Content -LiteralPath build/dist/SHA256SUMS-windows.txt -Value $lines -Encoding utf8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FusionGitDesk-windows-x64
          path: build/dist/*

  build-macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.3"
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Run tests
        run: go test ./...

      - name: Build macOS package
        run: bash ./scripts/build-macos.sh

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FusionGitDesk-macos-universal
          path: build/dist/*


  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: build/dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/*
          generate_release_notes: true
